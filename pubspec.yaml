name: portal_app
description: "Portal — stream your personal media library to your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # Video playback (ExoPlayer on Android)
  video_player: ^2.9.2

  # Audio playback + background
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.12

  # mDNS discovery
  nsd: ^5.0.1

  # Photo viewer
  photo_view: ^0.15.0

  # Persistent storage
  shared_preferences: ^2.3.3

  # Image loading + placeholders
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
