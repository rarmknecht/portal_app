name: portal_app
description: "Portal — stream your personal media library to your phone."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.11.1

  # Video playback (ExoPlayer on Android)
  video_player: ^2.14.0

  # Audio playback + background
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.12

  # mDNS discovery
  nsd: ^5.0.1

  # Photo viewer
  photo_view: ^0.15.0

  # Persistent storage (token lives in Keystore-backed secure storage)
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.2.0

  # Image loading + placeholders
  cached_network_image: ^4.0.2
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
